name: CI

# Every branch, every push — main auto-deploys to Render, so CI must have
# checked a branch BEFORE it is merged, not after.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Backend — build & full test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Compile
        run: mvn -B -q compile test-compile

      # Includes the real-Postgres 18 tests (same major version as production) (Testcontainers, separate Surefire
      # execution — see pom.xml). Docker is preinstalled on ubuntu-latest; the
      # API version pin keeps Testcontainers' docker-java client compatible
      # with newer Docker Engines (same setting used for local runs).
      - name: Run full test suite (incl. real Postgres 18)
        env:
          DOCKER_API_VERSION: "1.44"
        run: mvn -B test -Dapi.version=1.44

      - name: Check for expired DIAG() markers
        run: |
          today=$(date +%Y-%m-%d)
          expired=0
          while IFS=: read -r file line rest; do
            marker_date=$(echo "$rest" | grep -oE 'DIAG\(([0-9]{4}-[0-9]{2}-[0-9]{2})\)' | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}')
            if [ -n "$marker_date" ] && [[ "$marker_date" < "$today" ]]; then
              echo "::error file=$file,line=$line::Expired DIAG marker (was due $marker_date): $rest"
              expired=1
            fi
          done < <(grep -rn "DIAG([0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\})" src/main/java/ || true)
          if [ "$expired" -eq 1 ]; then
            echo "## ❌ Expired DIAG() marker(s) in backend code" >> "$GITHUB_STEP_SUMMARY"
            echo "Temporary code has outlived its stated removal date — see annotations above." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "No expired DIAG markers."

      - name: Fail loudly on any test failure
        if: failure()
        run: |
          echo "::error::Backend build or test suite failed. Scroll up to 'Run full test suite' for the specific failing test(s) — this must be green before merging."
          echo "## ❌ Backend CI failed" >> "$GITHUB_STEP_SUMMARY"
          echo "Compile or \`mvn test\` failed — see the job log above for which test(s)." >> "$GITHUB_STEP_SUMMARY"
          exit 1

  dashboard:
    name: Dashboard — lint, unit tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      # Vite 8 / Vitest 5 need Node 20.19+; 22 is the current LTS line.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  dashboard-browser:
    name: Dashboard — browser check (every page, demo data)
    runs-on: ubuntu-latest
    # An EMPTY database: the backend's DataInitializer seeds demo data only
    # (admin ADMIN001 / admin, demo products); the test adds a demo shop,
    # salesman and voucher through the API. Never real data.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: demo
          POSTGRES_PASSWORD: demo
          POSTGRES_DB: attendance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U demo -d attendance"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Build backend
        run: mvn -B -q package -DskipTests

      - name: Start backend on demo data
        env:
          DB_URL: jdbc:postgresql://localhost:5432/attendance
          DB_USERNAME: demo
          DB_PASSWORD: demo
          DB_DRIVER_CLASS_NAME: org.postgresql.Driver
          JWT_SECRET: ci-demo-only-secret-0123456789abcdef0123456789abcdef
          PORT: "8080"
        run: |
          nohup java -jar target/attendance-0.0.1-SNAPSHOT.jar > backend.log 2>&1 &
          for i in $(seq 1 90); do curl -sf localhost:8080/actuator/health >/dev/null && break; sleep 2; done
          curl -sf localhost:8080/actuator/health || { tail -50 backend.log; exit 1; }

      - name: Install dependencies and browser
        working-directory: dashboard
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build dashboard against the demo backend
        working-directory: dashboard
        env:
          VITE_API_URL: http://localhost:8080/api
        run: npm run build

      - name: Open every page (fails on page/console errors, 5xx, error messages)
        working-directory: dashboard
        env:
          E2E_API: http://localhost:8080/api
        run: npx playwright test

      - name: Keep screenshots, trace and backend log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-browser-check
          path: |
            dashboard/test-results/
            backend.log
          retention-days: 7

  mobile:
    name: Mobile — verify (lint + theme-color check + DIAG-marker check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run verify (ESLint no-console rule, theme-color check, DIAG-marker expiry check)
        run: npm run verify

      - name: Fail loudly on any violation
        if: failure()
        run: |
          echo "::error::Mobile verify failed. This is either a lint violation (check no-console/bare console.log), a theme-color reference bug, or an expired DIAG() marker — see the job log above."
          echo "## ❌ Mobile CI failed" >> "$GITHUB_STEP_SUMMARY"
          echo "\`npm run verify\` failed — see the job log above for lint / theme-color / DIAG-marker specifics." >> "$GITHUB_STEP_SUMMARY"
          exit 1
